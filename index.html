<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="./styles.css">
</head>
  <title>simple-counter-app</title>
</head>
<body>
  <!----------------CONTAINER---------------------->
  
  <div id="container" class="container">
    <!----------------NAVBAR---------------------->
    <section id="nav-bar" class="nav-bar">
    <nav id="nav-bar" class="nav-bar">
      
      <ul class="nav-list">
        <li id="logo" class="logo"><a href="#">SimpleCounter</a></li>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </section>
  <!----------------END OF NAV BAR---------------------->

  <!------------------HEADER----------------------> 
  <section id="header" class="header">   
    <header>
      <h1>Simple Counter App</h1>
    </header>

  
    <!--------------------COUNTER SECTION---------------------->
    <section class="counter-section">
      <article>
        <h2>Counter App</h2>
        <p>This is a simple counter application built with HTML, CSS, and JavaScript. Click the buttons below to increment or decrement the counter.</p>
      </article>
      <div class="counter-container">
        <button id="decrement" class="counter-button">-</button>
        <span id="counter-value" class="counter-value">0</span>
        <button id="increment" class="counter-button">+</button>
      </div>
    </section>
    
  </section>




   <!-----------------FOOTER---------------------->
   <section id="footer" class="footer">
    <div class="footer">
      <p> Coded by <a href="#">Aghaulor Gift</a></p>
      <p>&copy; 2024 Simple Counter App. All rights reserved.</p>
    </div>
    <section>

  </div>
  <script src="./scripts.js"></script>
</body>
</html>
